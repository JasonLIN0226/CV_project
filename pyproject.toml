[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-visual-memory"
version = "0.2.0"
description = "Bounded visual memory for world models: environments, predictors, retention methods and baselines"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4"]

[project.optional-dependencies]
model = [
  "torch>=2.5,<3", "Pillow>=10,<12", "PyYAML>=6,<7", "matplotlib>=3.8,<4",
  "transformers==5.5.4", "huggingface-hub==1.11.0", "safetensors==0.7.0"
]

[tool.setuptools.packages.find]
# bounded_memory is the package; phase1 (the frozen predictor source, the same files as
# bounded_memory.predictors.phase1) stays importable under its old top-level name for handoff/.
where = ["src", "src/bounded_memory/predictors", "."]
include = ["bounded_memory", "bounded_memory.*", "phase1", "phase1.*", "handoff", "handoff.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src", "src/bounded_memory/predictors"]
testpaths = ["tests"]
