name: Verify published results

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-results.txt
      - run: python -m pip install -r requirements-results.txt
      - run: python tools/verify_results.py
      - run: python -m pytest -q phase1_jepa_memory/runs/phase1_deletion_assay/test_assay.py
