name: Verify current code and results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify_results.py
      - run: python tools/verify_phase1_latest.py
      - run: python tools/verify_independent_confirmation.py
      - run: python tools/diagnose_signal.py --check
      - run: python -m pytest -q experiments/deletion/test_assay.py
  predictor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt Pillow PyYAML
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . --no-deps
      - name: Import portable loader outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from handoff.inference import Predictor; print(Predictor.__module__)"
      - run: python -m pytest -q experiments/predictor/control/test_centered_transport.py tests
      - run: python -m pytest -q experiments/independent_confirmation/test_budget_and_inference.py experiments/independent_confirmation/test_staged_data.py experiments/independent_confirmation/test_statistics.py experiments/independent_confirmation/test_submission.py
