name: Verify current code and results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the guard tests compare the package with the commit it was extracted from
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 PyYAML==6.0.3 Pillow==11.3.0 matplotlib==3.9.4 scikit-learn==1.7.2 scipy==1.17.1 pytest==7.4.4
      - run: python -m pip install -e . --no-deps
      - name: Import the package and the portable loader outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "import bounded_memory; from handoff.inference import Predictor; print(Predictor.__module__)"
      - run: python -m pytest -q tests
      - run: python tools/verify_phase1_latest.py
