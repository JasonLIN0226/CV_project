<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Memory Baselines Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one card per unit. Facts and one example on the left, one figure (and at most one small table) on the right. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #12161c; --ink-2: #4a515c; --muted: #6f7783;
  --rule: #dfe2e7; --grid: #e9ebef; --axis: #b9bfc8;
  --c-gray: #8a909b; --c-blue: #2a78d6; --c-orange: #eb6834; --c-aqua: #1baf7a; --c-yellow: #eda100;
  --tip-bg: #12161c; --tip-ink: #f4f5f7; --tip-2: #b9bfc8;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --lab: 64px; --namew: 186px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #181c23; --ink: #eceef1; --ink-2: #b9bfc8; --muted: #8b929d;
    --rule: #2a2f38; --grid: #242932; --axis: #414854;
    --c-gray: #6f7682; --c-blue: #3987e5; --c-orange: #d95926; --c-aqua: #199e70; --c-yellow: #c98500;
    --tip-bg: #eceef1; --tip-ink: #12161c; --tip-2: #4a515c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #181c23; --ink: #eceef1; --ink-2: #b9bfc8; --muted: #8b929d;
  --rule: #2a2f38; --grid: #242932; --axis: #414854;
  --c-gray: #6f7682; --c-blue: #3987e5; --c-orange: #d95926; --c-aqua: #199e70; --c-yellow: #c98500;
  --tip-bg: #eceef1; --tip-ink: #12161c; --tip-2: #4a515c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.5; }
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p, dl, dd, figure, pre { margin: 0; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-bottom: 6px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub, .snap { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.snap { flex-basis: 100%; }
.intro { color: var(--ink-2); max-width: 80ch; }
h2 { font-size: 18px; font-weight: 600; }
.views { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; align-self: flex-start; background: var(--surface); }
.views button { font: inherit; font-size: 13px; padding: 5px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.views button + button { border-left: 1px solid var(--rule); }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.views button:focus-visible { outline: 2px solid var(--c-blue); outline-offset: -2px; }
.units { display: flex; flex-direction: column; gap: 16px; }
.unit { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px); gap: 16px 32px; align-items: start; }
.unit.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 880px) { .unit { grid-template-columns: minmax(0, 1fr); } }
.left, .right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; }
.facts dt { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.facts dd { max-width: 66ch; }
.scroll { overflow-x: auto; min-width: 0; }
.strip { display: grid; gap: 3px 5px; width: max-content; align-items: center; }
.strip .cap { font-family: var(--mono); font-size: 10.5px; line-height: 1.2; color: var(--muted); align-self: end; padding-bottom: 1px; }
.strip .cap.hl { color: var(--ink); font-weight: 500; }
.strip .rl { font-size: 12px; color: var(--ink-2); padding-right: 6px; white-space: nowrap; }
.strip img { display: block; border: 1px solid var(--rule); border-radius: 2px; max-width: none; }
.strip.px img { image-rendering: pixelated; }
.single { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 2px; }
pre.sample { font-family: var(--mono); font-size: 12px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 10px 12px; }
.capline { font-size: 12px; color: var(--muted); }

.metric { font-size: 13.5px; font-weight: 600; }
.metric span { font-weight: 400; color: var(--muted); }
.plot { display: flex; flex-direction: column; gap: 2px; }
.grp { margin-top: 10px; padding-bottom: 2px; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: var(--namew) minmax(0, 1fr); align-items: center; column-gap: 10px; border-radius: 3px; outline: none; }
.row:hover, .row:focus-visible { background: var(--grid); }
.row:focus-visible { box-shadow: 0 0 0 2px var(--c-blue); }
.name { font-size: 13px; line-height: 1.25; padding-block: 4px; }
.name small { display: block; color: var(--muted); font-size: 11.5px; }
.track { position: relative; display: flex; align-items: center; min-height: 26px; height: 100%; }
.track .g { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
.bar { position: relative; height: 14px; border-radius: 0 4px 4px 0; flex: none; }
.row:hover .bar, .row:focus-visible .bar { filter: brightness(1.12); }
.val { position: relative; margin-left: 6px; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.val.na { margin-left: 0; color: var(--muted); }
.axis { display: grid; grid-template-columns: var(--namew) minmax(0, 1fr); column-gap: 10px; }
.axis .ticks { position: relative; height: 16px; border-top: 1px solid var(--axis); }
.axis .ticks span { position: absolute; top: 2px; transform: translateX(-50%); font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis .ticks span:first-child { transform: none; }
@media (max-width: 480px) { :root { --namew: 112px; } }

.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 14px; }
.panel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ptitle { font-size: 13px; line-height: 1.25; display: flex; gap: 7px; align-items: baseline; }
.ptitle small { display: block; color: var(--muted); font-size: 11.5px; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; display: inline-block; transform: translateY(1px); }
.panel svg { width: 100%; height: auto; display: block; max-width: 300px; outline: none; }
.panel svg:focus-visible { box-shadow: 0 0 0 2px var(--c-blue); border-radius: 3px; }
svg .gl { stroke: var(--grid); stroke-width: 1; }
svg .ax { stroke: var(--axis); stroke-width: 1; }
svg .id { stroke: var(--axis); stroke-width: 1; }
svg text { font-family: var(--mono); font-size: 9px; fill: var(--muted); }
svg .wait { font-family: var(--sans); font-size: 11px; fill: var(--muted); }
svg circle { stroke: var(--surface); stroke-width: 1; }
svg circle.out { fill: none; stroke-width: 1.5; }

table { border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 5px 16px 5px 0; border-bottom: 1px solid var(--rule); }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .sw { margin-right: 7px; }
td.na { color: var(--muted); }
.foot { font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border-radius: 5px; padding: 7px 10px; font-size: 12px; line-height: 1.4; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.22); }
.tip b { display: block; font-family: var(--mono); font-size: 14px; font-weight: 500; }
.tip span { color: var(--tip-2); display: block; }
</style>

  const lab = (f, m) => (f && f.labels && f.labels[m.key]) || m.label;
  const state = (f, key) => (f.pending && f.pending[key]) ? 'pending, ' + f.pending[key] : 'not run';
  const trim = v => String(+v.toPrecision(4));
  function tickText(v, step) {
    if (Math.abs(v) < Math.abs(step) * 1e-9) return '0';
    const e = Math.floor(Math.log10(step) + 1e-9);
    const d = Math.max(0, -e) + (Math.abs(step / Math.pow(10, e) - 2.5) < 1e-6 ? 1 : 0);
    return v.toFixed(d);
  }
  function niceStep(span, n) {
    const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * mag * (1 + 1e-9)) return m * mag;
    return 10 * mag;
  }

  /* ---------- example: image strip, single image, or text sample ---------- */
  function example(e) {
    const wrap = el('figure', 'ex');
    if (e.rows) {
      const tile = e.tile || 80, hl = e.highlight || [];
      const n = Math.max(...e.rows.map(r => r.images.length));
      const grid = el('div', 'strip' + (e.pixelated ? ' px' : ''));
      const labelled = e.rows.some(r => r.label);
      grid.style.gridTemplateColumns = (labelled ? 'auto ' : '') + 'repeat(' + n + ', ' + tile + 'px)';
      if (e.columns) {
        if (labelled) grid.append(el('div'));
        e.columns.forEach((c, i) => grid.append(el('div', 'cap' + (hl.includes(i) ? ' hl' : ''), c)));
      }
      e.rows.forEach(r => {
        if (labelled) grid.append(el('div', 'rl', r.label || ''));
        r.images.forEach((src, i) => {
          const im = el('img'); im.src = src; im.width = tile; im.height = tile;
          im.alt = [r.label, e.columns && e.columns[i]].filter(Boolean).join(', ') || 'example';
          grid.append(im);
        });
      });
      const sc = el('div', 'scroll'); sc.append(grid); wrap.append(sc);
    } else if (e.image) {
      const im = el('img', 'single'); im.src = e.image; im.alt = e.alt || 'example'; wrap.append(im);
    } else if (e.text) {
      wrap.append(el('pre', 'sample', e.text));
    }
    if (e.caption) wrap.append(el('figcaption', 'capline', e.caption));
    return wrap;
  }

  /* ---------- figure: bars (one number per method) ---------- */
  function bars(f) {
    const out = [];
    const head = el('p', 'metric', f.metric + ' ');
    if (f.direction) head.append(el('span', '', '(' + f.direction + ')'));
    out.push(head);
    const vals = f.values || {};
    /* Project extension: a block lists its own rows (figure.rows, in display order), and a method's
       `group` prints one heading where the group starts. */
    const R = f.rows ? f.rows.map(k => M.find(m => m.key === k)).filter(Boolean) : M;
    const nums = R.map(m => vals[m.key]).filter(v => typeof v === 'number');
    const pctUnit = f.unit === '%';
    let max = f.max, ticks = f.ticks;
    if (max == null) {
      if (pctUnit) max = 100;
      else { const top = Math.max(...nums, 0) || 1; const st = niceStep(top * 1.02, 4); max = Math.ceil(top * 1.02 / st - 1e-9) * st; }
    }
    if (!ticks) { const st = niceStep(max, 4); ticks = []; for (let t = 0; t <= max * (1 + 1e-9); t += st) ticks.push(+t.toPrecision(10)); }
    const dec = f.decimals != null ? f.decimals : (pctUnit ? 1 : 3);
    const fmt = v => v.toFixed(dec) + (pctUnit ? '%' : '');
    const pos = v => 'calc((100% - var(--lab)) * ' + Math.max(0, Math.min(1, v / max)).toFixed(5) + ')';
    const plot = el('div', 'plot');
    let group = null;
    R.forEach(m => {
      if (m.group && m.group !== group) plot.append(el('div', 'grp', m.group));
      group = m.group || null;
      const v = vals[m.key], has = typeof v === 'number';
      const text = has ? fmt(v) : state(f, m.key);
      const who = f.who && f.who[m.key], note = f.notes && f.notes[m.key];
      const row = el('div', 'row'); row.tabIndex = 0;
      row.setAttribute('aria-label', [lab(f, m), who].filter(Boolean).join(', ') + ': ' + text);
      const name = el('div', 'name', lab(f, m)); if (who) name.append(el('small', '', who));
      const track = el('div', 'track');
      ticks.forEach(t => { const g = el('i', 'g'); g.style.left = pos(t); track.append(g); });
      if (has && v > 0) { const b = el('div', 'bar'); b.style.width = pos(v); b.style.background = color(m); track.append(b); }
      track.append(el('span', 'val' + (has ? '' : ' na'), text));
      row.append(name, track);
      const headText = [lab(f, m), who].filter(Boolean).join(': ');
      row.addEventListener('pointermove', e => showTip(headText, text, note, e.clientX, e.clientY));
      row.addEventListener('pointerleave', hideTip);
      row.addEventListener('focus', () => { const b = row.getBoundingClientRect(); showTip(headText, text, note, b.left + b.width / 2, b.bottom - 6); });
      row.addEventListener('blur', hideTip);
      plot.append(row);
    });
    out.push(plot);
    const axis = el('div', 'axis'), tk = el('div', 'ticks');
    const tstep = ticks.length > 1 ? ticks[1] - ticks[0] : max;
    ticks.forEach(t => { const s = el('span', '', pctUnit ? t + '%' : tickText(t, tstep)); s.style.left = pos(t); tk.append(s); });
    axis.append(el('div'), tk); out.push(axis);
    return out;
  }

  /* ---------- figure: scatter (one panel per method, shared axes) ---------- */
  function scatter(f) {
    const out = [];
    const head = el('p', 'metric', f.metric || ((f.y_label || 'y') + ' vs ' + (f.x_label || 'x')));
    if (f.direction) head.append(el('span', '', ' (' + f.direction + ')'));
    out.push(head);
    const pts = f.points || {};
    let lo = Infinity, hi = -Infinity;
    if (f.domain) { lo = f.domain[0]; hi = f.domain[1]; }
    else M.forEach(m => (pts[m.key] || []).forEach(p => { lo = Math.min(lo, p[0], p[1]); hi = Math.max(hi, p[0], p[1]); }));
    if (!(hi > lo)) { lo = 0; hi = 1; }
    const st = niceStep(hi - lo, 4);
    const a = Math.floor(lo / st + 1e-9) * st, b = Math.ceil(hi / st - 1e-9) * st;
    const ticks = []; for (let t = a; t <= b + st * 1e-6; t += st) ticks.push(+t.toPrecision(10));
    const W = 200, L = 32, R = 14, T = 6, B = 20, span = W - L - R;
    const X = v => L + (Math.max(a, Math.min(b, v)) - a) / (b - a) * span;
    const Y = v => T + span - (Math.max(a, Math.min(b, v)) - a) / (b - a) * span;
    const grid = el('div', 'panels');
    M.forEach(m => {
      const P = pts[m.key], who = f.who && f.who[m.key];
      const panel = el('div', 'panel');
      const title = el('div', 'ptitle'); const sw = el('i', 'sw'); sw.style.background = color(m);
      const tx = el('div', '', lab(f, m)); if (who) tx.append(el('small', '', who));
      title.append(sw, tx); panel.append(title);
      const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + (T + span + B), role: 'img' });
      svg.setAttribute('aria-label', lab(f, m) + ': ' + (P ? P.length + ' points' : state(f, m.key)));
      ticks.forEach(t => {
        svg.append(sv('line', { class: 'gl', x1: X(t), x2: X(t), y1: T, y2: T + span }), sv('line', { class: 'gl', x1: L, x2: L + span, y1: Y(t), y2: Y(t) }));
        const tx1 = sv('text', { x: X(t), y: T + span + 12, 'text-anchor': 'middle' }); tx1.textContent = tickText(t, st);
        const ty1 = sv('text', { x: L - 4, y: Y(t) + 3, 'text-anchor': 'end' }); ty1.textContent = tickText(t, st);
        svg.append(tx1, ty1);
      });
      svg.append(sv('line', { class: 'ax', x1: L, x2: L + span, y1: T + span, y2: T + span }), sv('line', { class: 'ax', x1: L, x2: L, y1: T, y2: T + span }));
      if (f.identity !== false && P) svg.append(sv('line', { class: 'id', x1: X(a), y1: Y(a), x2: X(b), y2: Y(b) }));
      if (!P) {
        const w = sv('text', { class: 'wait', x: L + span / 2, y: T + span / 2, 'text-anchor': 'middle' }); w.textContent = state(f, m.key); svg.append(w);
      } else {
        const dots = P.map(p => {
          const outside = p[0] < a || p[0] > b || p[1] < a || p[1] > b;
          const c = sv('circle', { cx: X(p[0]), cy: Y(p[1]), r: 3 });
          if (outside) { c.setAttribute('class', 'out'); c.style.stroke = color(m); } else c.style.fill = color(m);
          svg.append(c); return c;
        });
        let cur = -1;
        const clear = () => { if (cur >= 0) dots[cur].setAttribute('r', 3); cur = -1; hideTip(); };
        const pick = (i, cx, cy) => {
          if (cur >= 0) dots[cur].setAttribute('r', 3);
          cur = i; dots[i].setAttribute('r', 5);
          const p = P[i];
          showTip(p[2] != null ? String(p[2]) : lab(f, m), trim(p[0]) + ' → ' + trim(p[1]), (f.x_label || 'x') + ' → ' + (f.y_label || 'y'), cx, cy);
        };
        svg.addEventListener('pointermove', e => {
          const r = svg.getBoundingClientRect(), k = W / r.width;
          const px = (e.clientX - r.left) * k, py = (e.clientY - r.top) * k;
          let best = -1, bd = 14 * 14;
          P.forEach((p, i) => { const d = (X(p[0]) - px) ** 2 + (Y(p[1]) - py) ** 2; if (d < bd) { bd = d; best = i; } });
          if (best < 0) clear(); else pick(best, e.clientX, e.clientY);
        });
        svg.addEventListener('pointerleave', clear);
        svg.tabIndex = 0;
        svg.addEventListener('keydown', e => {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          e.preventDefault();
          const i = ((cur < 0 ? 0 : cur + (e.key === 'ArrowRight' ? 1 : -1)) + P.length) % P.length;
          const r = dots[i].getBoundingClientRect(); pick(i, r.left, r.top);
        });
        svg.addEventListener('blur', clear);
      }
      panel.append(svg); grid.append(panel);
    });
    out.push(grid);
    if (f.x_label || f.y_label) out.push(el('p', 'capline', 'Horizontal: ' + (f.x_label || 'x') + '. Vertical: ' + (f.y_label || 'y') + (f.identity !== false ? '. Line: perfect agreement.' : '.')));
    return out;
  }

  /* ---------- one small table, rows are the methods ---------- */
  function table(t, f) {
    const tb = el('table'), hr = el('tr');
    hr.append(el('th', '', t.first || 'Method'));
    t.columns.forEach(c => hr.append(el('th', 'num', c)));
    const th = el('thead'); th.append(hr); const body = el('tbody');
    M.forEach(m => {
      const tr = el('tr'), td = el('td'), sw = el('i', 'sw'); sw.style.background = color(m);
      td.append(sw, document.createTextNode(lab(f, m))); tr.append(td);
      const cells = t.rows && t.rows[m.key];
      if (cells) cells.forEach(c => tr.append(el('td', 'num', String(c))));
      else { const c = el('td', 'num na', state(f || {}, m.key)); c.colSpan = t.columns.length; tr.append(c); }
      body.append(tr);
    });
    tb.append(th, body);
    const sc = el('div', 'scroll'); sc.append(tb); return sc;
  }

  function unit(u) {
    const f = u.figure, wide = f && f.type === 'scatter';
    const sec = el('section', 'unit' + (wide ? ' wide' : ''));
    const left = el('div', 'left'), right = el('div', 'right');
    left.append(el('h2', '', u.name));
    if (u.facts && u.facts.length) {
      const dl = el('dl', 'facts');
      u.facts.forEach(([k, v]) => dl.append(el('dt', '', k), el('dd', '', v)));
      left.append(dl);
    }
    if (u.example) left.append(example(u.example));
    if (f) right.append(...(wide ? scatter(f) : bars(f)));
    if (u.table) right.append(table(u.table, f));
    if (u.footnote) right.append(el('p', 'foot', u.footnote));
    sec.append(left, right);
    return sec;
  }

  const header = el('header');
  header.append(el('h1', '', S.title));
  if (S.subtitle) header.append(el('span', 'sub', S.subtitle));
  if (S.snapshot) header.append(el('span', 'snap', S.snapshot));
  page.append(header);
  if (S.intro) page.append(el('p', 'intro', S.intro));
  const views = S.views && S.views.length ? S.views : [{ name: null, units: S.units || [] }];
  const host = el('div', 'units');
  let buttons = [];
  function show(i) {
    hideTip();
    host.replaceChildren(...views[i].units.map(unit));
    buttons.forEach((b, j) => b.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
  }
  if (views.length > 1) {
    const seg = el('div', 'views'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Evaluation set');
    buttons = views.map((v, i) => { const b = el('button', '', v.name); b.type = 'button'; b.id = 'view-' + i; b.addEventListener('click', () => show(i)); seg.append(b); return b; });
    page.append(seg);
  }
  page.append(host);
  show(0);
  window.addEventListener('scroll', hideTip, { passive: true });
})();
</script>
</body></html>
