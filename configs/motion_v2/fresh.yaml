# Our deletion-cost scorer (v2) on Motion v2, trained on fresh scenes (environments/motion_v2/fresh.py) and scored
# on the frozen study readers. Used by scripts/prepare_data/motion_v2_fresh.py, generate_teacher_labels/motion_v2.py,
# train_scorer/motion_v2_deletion_cost_v2.py and evaluate/motion_v2_deletion_cost_v2.py (manifest tasks motion_v2.fresh.*,
# motion_v2.registered.*, motion_v2.validate.*).
# `assets` is the block of configs/motion_v2/frozen.yaml, unchanged (tests/motion_v2/test_frozen.py checks it): set
# BM_MOTION_ROOT as there. The fresh scenes and loss tables go to BM_SCRATCH. The scorers of a run go to the folder
# the train and evaluate scripts get as --checkpoints (the manifest passes one under BM_RUN per run), so the holdout
# check and the validation look of a run read that run's own checkpoints.
environment: motion_v2
assets:
  step2: ${BM_MOTION_ROOT}/motion-v2-20261031-deployment3/repo/results/motion_v2/v2_3_1/step2_gpu_attempt1
  dataset: ${BM_MOTION_ROOT}/motion-v2-20261031-deployment3/repo/results/motion_v2/v2_2/step1/data/dataset
  evidence: ${BM_REPO}/results/motion_v2/step3_4_recovery1/terminal_evidence/repo/results/motion_v2/step3_4_recovery1/gpu
  longgap_receipt: ${BM_MOTION_ROOT}/motion-v2-20261101-step34-deployment2/repo/results/motion_v2/step3_4/cpu
  longgap_features: ${BM_MOTION_ROOT}/motion-v2-20261101-step34-deployment2/repo/results/motion_v2/step3_4_recovery1/gpu/longgap_features
fresh:              # scene pairs drawn under the split name fresh_train_20261125 (no reader has seen them)
  root: ${BM_SCRATCH}/motion_v2_fresh/scenes            # dataset/ and features/, generated and encoded once
  tables: ${BM_SCRATCH}/motion_v2_fresh/scorer/tables   # all-pairs loss tables, one per episode
  fit_pairs: 512      # scene pairs 0-511: training states
  dev_pairs: 96       # 512-607: checkpoint, round and variant selection
  holdout_pairs: 96   # 608-703: one check of the chosen scorers before validation is read
scorer:
  steps: 3000
  registered_tables: ${BM_SCRATCH}/motion_v2_registered/tables   # --episodes registered (the readers' own training episodes)
protocol:
  reader_seeds: [17, 29, 43]
  student_seeds: [17, 29, 43]
  split: validation, 96 scene pairs
  horizons: [3, 6]
  intervals: [ordinary, long_gap]
