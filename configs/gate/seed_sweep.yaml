# Gate seed sweep: two-slot Compress to Remember and our scorer, each trained with its own training
# seeds (initial weights, minibatch order) on each of the team's three frozen predictors. Our scorer's
# teacher labels are regenerated per predictor seed, as in retrained_scorer_on_team_assets.yaml.
environment: gate
path: sweep
assets:
  root: ${BM_SCRATCH}/gate_team/root
  predictor_sha256: team
  students: ${BM_RUN}/gate/sweep/students
protocol:
  recent: 4
  budget: 2
  horizons: [3, 6]
  seeds: [17, 29, 43]
  split: validation
  train_episodes: 1024
  validation_episodes: 192
baselines:
  pacc: {steps: 3000}
