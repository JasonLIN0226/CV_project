results:
  # Gate has two retraining routes. retrain_scorer: only our scorer and its twin are retrained, on the team's
  # frozen predictors (isolates the method). retrain: dataset, features and predictors are regenerated first
  # (tasks gate.retrain.*), then every reference, heuristic, our scorer and PaFu-KV are run on those predictors.
  # Compress to Remember and FrameMorrow are not rerun on the retrained predictors.
  gate:
    # id: the policy name in the row files. group: reference | project_baseline | ablation | literature | ours.
    # memory: none | bounded (two slots, online) | full_history (reads every eligible frame) | privileged (uses cue timestamps).
    - {id: recent_only, panel_key: floor, group: reference, memory: none, method: none,
       replay: {task: gate.replay.references, status: replayable, tolerance: exact}}
    - {id: oracle_keyframe, panel_key: oracle, group: reference, memory: privileged, method: evaluation/oracles/gate.py oracle_keyframe,
       replay: {task: gate.replay.references, status: replayable, tolerance: exact}}
    - {id: full_history, panel_key: null, group: reference, memory: full_history, method: evaluation/oracles/gate.py full_history,
       replay: {task: gate.replay.references, status: replayable, tolerance: exact},
       note: the teacher that Compress to Remember copies; not a bounded policy}
    - {id: fifo, panel_key: fifo, group: project_baseline, memory: bounded, method: evaluation/heuristics/gate.py,
       replay: {task: gate.replay.heuristics, status: replayable, tolerance: exact}}
    - {id: reservoir, panel_key: reservoir, group: project_baseline, memory: bounded, method: evaluation/heuristics/gate.py,
       replay: {task: gate.replay.heuristics, status: replayable, tolerance: exact}}
    - {id: temporal_buckets, panel_key: buckets, group: project_baseline, memory: bounded, method: evaluation/heuristics/gate.py,
       replay: {task: gate.replay.heuristics, status: replayable, tolerance: exact}}
    - {id: visual_diversity, panel_key: diversity, group: project_baseline, memory: bounded, method: evaluation/heuristics/gate.py,
       replay: {task: gate.replay.heuristics, status: replayable, tolerance: exact}}
    - {id: prediction_surprise, panel_key: surprise, group: project_baseline, memory: bounded, method: evaluation/heuristics/gate.py,
       replay: {task: gate.replay.heuristics, status: replayable, tolerance: exact}}
    - {id: attention, panel_key: attention, group: project_baseline, memory: bounded, method: evaluation/heuristics/gate.py,
       replay: {task: gate.replay.heuristics, status: replayable, tolerance: exact},
       note: the comparator the README retired from its table}
    - {id: attention_proxy_student, panel_key: proxy, group: ablation, memory: bounded,
       method: methods/deletion_cost with the attention-proxy teacher (ablations/attention_proxy.py),
       replay: {task: gate.replay.attention_proxy, status: replayable, tolerance: exact, checkpoint: "published student_<seed>.pt, first arm"},
       retrain: {tasks: [gate.retrain_scorer.teacher_labels, gate.retrain_scorer.train, gate.retrain_scorer.attention_proxy],
                 status: retrainable, tolerance: per_seed}}
    - {id: deletion_cost_student, panel_key: ours, group: ours, memory: bounded,
       method: methods/deletion_cost (scorer.py, teacher.py, retention.py, training.py),
       training_procedure: "4,096 training states from four behaviour policies; teacher = frozen predictor error after each deletion; 1,000 AdamW steps of 64, no validation selection",
       replay: {task: gate.replay.deletion_cost, status: replayable, tolerance: exact, checkpoint: "published student_<seed>.pt, second arm"},
       retrain: {tasks: [gate.retrain_scorer.teacher_labels, gate.retrain_scorer.train, gate.retrain_scorer.deletion_cost],
                 status: retrainable, tolerance: per_seed}}
    - {id: pafu_kv, panel_key: pafu, group: literature, memory: bounded, method: methods/pafu_kv/gate.py,
       replay: {task: gate.replay.pafu_kv, variant: pafu_kv, status: retrainable, tolerance: per_seed},
       note: "no released checkpoint; trained here on the frozen predictor, 1000 steps"}
    - {id: pafu_teacher_top2, panel_key: null, group: literature_teacher, memory: privileged, method: methods/pafu_kv/gate.py teacher_select,
       replay: {task: gate.replay.pafu_kv, variant: pafu_kv, status: replayable, tolerance: exact},
       note: diagnostic; the future-reading signal PaFu-KV is trained to copy}
    - {id: pafu_kv_repo, panel_key: pafu_repo, group: literature, memory: bounded, method: methods/pafu_kv/repo_adaptation.py,
       replay: {task: gate.replay.pafu_kv, variant: pafu_kv_repo, status: retrainable, tolerance: per_seed}}
    - {id: pacc_full, panel_key: c2r, group: literature, memory: full_history, method: methods/pacc (variant full),
       replay: {task: gate.replay.pacc, variant: pacc_full, status: retrainable, tolerance: per_seed},
       note: as published it reads the whole eligible history at the query}
    - {id: pacc_recurrent, panel_key: c2r_slots, group: literature, memory: bounded, method: methods/pacc (variant recurrent),
       replay: {task: gate.replay.pacc, variant: pacc_recurrent, status: retrainable, tolerance: unstable},
       note: "not in the paper; training fails on one of three seeds on CPU and on both seeds tried on GPU, so per-seed values can flip between runs"}
    - {id: fm_dinov2_published, panel_key: fm, group: literature, memory: full_history, method: methods/framemorrow/gate.py select_published,
       replay: {task: gate.replay.framemorrow, variant: fm_dinov2_published, status: retrainable, tolerance: per_seed}}
    - {id: fm_dinov2_teacher_top2, panel_key: null, group: literature_teacher, memory: privileged, method: methods/framemorrow/gate.py select_teacher,
       replay: {task: gate.replay.framemorrow, variant: fm_dinov2_published, status: replayable, tolerance: exact}}
    - {id: fm_dinov2_online, panel_key: fm_slots, group: literature, memory: bounded, method: methods/framemorrow/gate.py select_online,
       replay: {task: gate.replay.framemorrow, variant: fm_dinov2_online, status: retrainable, tolerance: per_seed}}
    - {id: fm_ijepa_published, panel_key: null, group: literature, memory: full_history, method: methods/framemorrow/gate.py,
       replay: {status: not_run}, note: optional variant on the project's I-JEPA features; never run}
    - {id: fm_ijepa_online, panel_key: null, group: literature, memory: bounded, method: methods/framemorrow/gate.py,
       replay: {status: not_run}, note: optional variant on the project's I-JEPA features; never run}

  synergy:
    # Reported per reader (multihead, item_attention) and task family (R, D, S). The panel shows S on the multihead reader.
    - {id: fifo, panel_key: floor, group: reference, memory: bounded, method: delete the oldest card,
       replay: {task: synergy.replay.rules, status: replayable, tolerance: exact}}
    - {id: oracle, panel_key: oracle, group: reference, memory: privileged, method: lowest-error deletion,
       replay: {task: synergy.replay.references, status: replayable, tolerance: exact}}
    - {id: three_cards, panel_key: null, group: reference, memory: full_history, method: the reader given all three cards,
       replay: {task: synergy.replay.references, status: replayable, tolerance: exact},
       note: the teacher that Compress to Remember copies; not a bounded memory}
    - {id: attention, panel_key: attention, group: project_baseline, memory: bounded, method: evaluation/heuristics/synergy.py,
       replay: {task: synergy.replay.rules, status: replayable, tolerance: exact}}
    - {id: full_set_sensitivity, panel_key: sensitivity, group: project_baseline, memory: bounded, method: evaluation/heuristics/synergy.py,
       replay: {task: synergy.replay.rules, status: replayable, tolerance: exact}}
    - {id: medoid, panel_key: null, group: project_baseline, memory: bounded, method: evaluation/heuristics/synergy.py,
       replay: {task: synergy.replay.rules, status: replayable, tolerance: none},
       note: scored by the study but not part of the frozen reference values}
    - {id: deletion_cost_student_set, panel_key: ours, group: ours, memory: bounded,
       method: methods/deletion_cost (terminal.py teacher labels; terminal_students.py set-conditioned scorer),
       training_procedure: "labels = mean reader loss per deletion over 16 reference plans on 3,456 TRAIN records; 1,000 steps of 128; checkpoint with the lowest own-label validation cross-entropy, step 0 included",
       replay: {task: synergy.replay.deletion_cost, status: replayable, tolerance: exact, checkpoint: released student archive <reader>_standard},
       retrain: {tasks: [synergy.retrain.stage_a, synergy.retrain.students, synergy.retrain.deletion_cost], status: retrainable, tolerance: per_seed}}
    - {id: deletion_cost_student_independent, panel_key: cost_ind, group: ablation, memory: bounded, method: ours with independent scoring,
       replay: {task: synergy.replay.ablations, status: replayable, tolerance: exact},
       retrain: {tasks: [synergy.retrain.students, synergy.retrain.ablations], status: retrainable, tolerance: per_seed}}
    - {id: future_attention_student_set, panel_key: fut_set, group: ablation, memory: bounded, method: set-conditioned scorer trained on the future-attention teacher,
       replay: {task: synergy.replay.ablations, status: replayable, tolerance: exact},
       retrain: {tasks: [synergy.retrain.students, synergy.retrain.ablations], status: retrainable, tolerance: per_seed}}
    - {id: future_attention_student_independent, panel_key: fut_ind, group: ablation, memory: bounded, method: independent scorer trained on the future-attention teacher,
       replay: {task: synergy.replay.ablations, status: replayable, tolerance: exact},
       retrain: {tasks: [synergy.retrain.students, synergy.retrain.ablations], status: retrainable, tolerance: per_seed}}
    - {id: shuffled_label_student_set, panel_key: shuf_set, group: ablation, memory: bounded, method: set-conditioned scorer trained on shuffled cost labels,
       replay: {task: synergy.replay.ablations, status: replayable, tolerance: exact},
       retrain: {tasks: [synergy.retrain.students, synergy.retrain.ablations], status: retrainable, tolerance: per_seed}}
    - {id: shuffled_label_student_independent, panel_key: shuf_ind, group: ablation, memory: bounded, method: independent scorer trained on shuffled cost labels,
       replay: {task: synergy.replay.ablations, status: replayable, tolerance: exact},
       retrain: {tasks: [synergy.retrain.students, synergy.retrain.ablations], status: retrainable, tolerance: per_seed}}
    - {id: appearance_only_student, panel_key: appearance, group: ablation, memory: bounded, method: independent cost scorer restricted to appearance features,
