# Reproduction manifest: every significant result of the 11 Nov 2026 panel and how to get it again.
#
#   reference panel   reports/memory_results_20261111/memory-panel-baselines.html   (read-only)
#   reference values  configs/reference_values.json, frozen from the sources named below by
#                     scripts/aggregate_results/freeze_reference_values.py
#
# Two reproduction paths are kept apart everywhere:
#   replay    released checkpoints and arrays are loaded and scored again; only the literature
#             baselines, which were never released, are trained. This path recreates the panel.
#   retrain   data, features, predictors and students are regenerated or retrained. Its numbers are
#             new measurements and are reported next to the panel, never inside it.
#
# `tasks` are the units of compute. torch/make_jobs.py expands each one over its seeds and variants
# into a Slurm array, so no seed or variant can be left out by hand. `results` link each number to
# its environment (dataset, split, seeds, encoder, predictor), method, metric, tasks and sources.
version: 1
protocol:
  recent_frames: 4
  memory_slots: 2
  note: every method reads the same four recent frames; methods differ only in what fills the memory

status_vocabulary:
  replayable: released artifacts exist and the result is recomputed from them
  retrainable: every input can be regenerated and a launcher exists
  assets_missing: a required frozen asset is not available to this account
  not_run: the experiment has never been run
  extracted_only: code is in the package and tested, but no result has been produced with it
tolerance_vocabulary:
  exact: deterministic replay; the primary metric must match to 1e-9 and secondary metrics to 1e-5
  tie_sensitive: deterministic code whose choice between exactly tied candidates depends on CPU rounding; within 1 point
  per_seed: a model trained in this run; reported per seed, within 1 point on the pooled primary metric
  unstable: training known to succeed or fail between runs and devices; no verdict, per-seed values only

environments:
  gate:
    summary: an arrow panel shows a direction once, early; after the query the ball takes the upper or lower route
    dataset:
      name: clean-future Gate train/validation v1
      generator: src/bounded_memory/environments/gate/generate.py
      generator_config: configs/gate/dataset_config_template.json
      seed: 6301
      episodes: {train: 1024, validation: 192}
      frames: 42560
      released: {repository: cv-project-team5guys/gate-clean-future-trainval-v1, type: dataset,
                 tar_sha256: 80ef7ea826848664fa240274cca5d6639f02373a0ae1946de3a33f903a28a937}
    split: validation, 192 episodes in 96 sibling pairs; no test split exists for this dataset
    seeds: [17, 29, 43]
    horizons: [3, 6]
    encoder: {name: I-JEPA ViT-H/14, repository: facebook/ijepa_vith14_1k,
              revision: f157467ea509bc356ff9f61fd3c0d840eec5e04e, pooling: grid2, frozen: true}
    predictor:
      architecture: DynamicsPredictor, hidden 128, rank 128, dropout 0 (src/bounded_memory/predictors/dynamics.py)
      training: 120 epochs, batch 64, AdamW lr 0.001, one model per seed, frozen afterwards
      released: {repository: cv-project-team5guys/gate-retention-models-v1, type: model,
                 tar_sha256: b54c32e4410348993cc908856acd96f4cdea965cd081ad27125ff61183a4fa12}
      checkpoint_sha256:
        17: 449bb70e55161ff553ce4b2e75e9e093a58e1914f268bbe3748442f0315f9ed0
        29: f7301b06df9e62fede69268c53e1bc0f08de027659fe9f15f561756faba8d3c2
        43: 96311a7cf010c527ae8f6c29a390a8275d0b402718dd57928395f832b07e7782
      basis_sha256: 1828bd01d83a0c9b1e504739d3bd864bb9469ff3fb058292c895ca198dd0da8d
    metrics:
      route_accuracy: {primary: true, direction: higher, definition: sign of the frozen linear state decoder on the predicted latent equals the true route}
      normalized_mse: {direction: lower, definition: mean squared error in train-normalised I-JEPA feature space}
      cue_kept: {direction: higher, definition: share of episodes whose memory holds a frame from the cue interval}
    aggregation: mean over 192 episodes x 3 seeds x 2 horizons; repeated rows are not independent samples
    reference_file: results/memory_baselines/gate_team/summary.json
    configs: {replay: configs/gate/team_bundle.yaml, retrain: configs/gate/rebuilt.yaml,
              retrain_scorer: configs/gate/retrained_scorer_on_team_assets.yaml}

  synergy:
    summary: three cue cards arrive and one must be deleted; R redundancy, D decoy, S XOR synergy (two cards with matching tags decide the future together)
    dataset:
      name: terminal R/D/S structures, 2026-10-25
      generator: src/bounded_memory/environments/synergy/generate.py, through environments/synergy/dataset.py
      splits: {train: {seed: 20261101, families: 48, records: 3456}, validation: {seed: 20261102, families: 24, records: 1728},
               confirmation: {seed: 20261104, families: 48, records: 3456, opened: "2026-10-26, once"}}
      released: "GitHub releases terminal-structures-20261025 and qualified-reader-retention-confirmation-20261026 (public)"
    split: locked confirmation, 3,456 records in 48 families (576 R, 576 D, 2,304 S); no further held-out data may be opened
    seeds: {reader: 17, students: [17, 29, 43], literature_baselines: [17, 29, 43]}
    horizons: [3, 6]
    encoder: {name: I-JEPA ViT-H/14, repository: facebook/ijepa_vith14_1k, frozen: true}
    predictor:
      architecture: multihead and item_attention readers (src/bounded_memory/predictors/readers.py), hidden 128, rank 128
      training: 1,024 updates, pure feature MSE, memory sizes 0/1/2/3 equally represented, frozen afterwards
      checkpoint_sha256:
        multihead: fb0ea31b20e5aa53c4f3adbaa1b261d82826cda068ad23fa5d1a9edd56221543
        item_attention: 15428e52128c16887238bf4a424691b0785966001c680a0a409f13cf8026a597
      basis_sha256: 922bc4a676893d0ba5974cd20dbcac09c461bc908549966f197dfbbe38f4f05d
    metrics:
      needed_evidence_lost: {primary: true, direction: lower, definition: share of records where a semantically needed card is deleted; undefined for memories that delete nothing}
      regret: {direction: lower, definition: "expected in-span prediction loss over 32 evaluation plans minus that of the best single deletion; family mean"}
    aggregation: per task family (R, D, S), mean over records and student or baseline seeds
    reference_files: [results/memory_baselines/synergy/released_scores.json, results/memory_baselines/synergy/summary.json]
    configs: {replay: configs/synergy/release.yaml, retrain: configs/synergy/release.yaml}

  motion_v2:
    summary: a ball is kicked into a new lane, then hidden; its direction can only be read from two frames after the kick
    dataset: {name: Motion v2, episodes: {train: 1024, validation: 192}, availability: "dataset archive only on a teammate's storage (/scratch/xy3257); not available to this account"}
    split: validation, 96 scene pairs; ordinary interval is primary, long gap is reported separately
    seeds: {readers: [17, 29, 43], students: [17, 29, 43]}
    horizons: [3, 6]
    encoder: {name: I-JEPA ViT-H/14, frozen: true}
    predictor: {architecture: Motion v2 reader (src/bounded_memory/environments/motion_v2/reader_v2.py), availability: "three frozen readers only on a teammate's storage"}
    metrics:
      position_mse: {primary: true, direction: lower, definition: mean squared error of the decoded normalised ball position}
      feature_mse: {direction: lower}
      success_rate: {direction: higher, definition: share of episodes whose memory holds both cue frames}
    aggregation: mean over siblings, 96 scene pairs, three reader seeds and three student or RNG seeds
    evidence:
      step34: results/motion_v2/step3_4_recovery1/terminal_evidence/repo/results/motion_v2/step3_4_recovery1/gpu
      step2: results/motion_v2/v2_3_1_resubmission/terminal_evidence/repo/results/motion_v2/v2_3_1/step2_gpu_attempt1
    missing_assets: [frozen Motion v2 readers (seeds 17, 29, 43), I-JEPA feature caches, the dataset archive]
    from_scratch: "not attempted. The original run scripts (src/bounded_memory/environments/motion_v2/pipeline: run_step1.py, run_step2.py, run_step34_recovery1.py) are kept byte-identical but verify checksums registered under their old paths and require one A100; they need re-registration before they run"
    code: src/bounded_memory/environments/motion_v2/ (environment, generator, reader, metrics, students; tests/motion_v2) and pipeline/ (original run scripts, not runnable yet)
    configs: {replay: configs/motion_v2/evidence.yaml}
  pusht:
    summary: hidden centre-of-gravity PushT; a push after the query turns the block according to a class seen only early in the episode
    versions:
      v5: {name: marker, cue: the centre of gravity is drawn as a dot for 3 early frames, corpus: pusht-cog-v5-marker-20261109,
           families: {train: 128, validation: 32, test: 32}, episodes: {train: 384, validation: 96, test: 96},
           generator: src/bounded_memory/environments/pusht/prepare_pusht_cog_marker_data.py, state: collected; not encoded}
      v4: {name: natural, cue: "the block's response to a shared probe push", corpus: pusht-cog-v4-20261107,
           families: {train: 128, validation: 32, test: 32}, episodes: {train: 384, validation: 96, test: 96},
           generator: src/bounded_memory/environments/pusht/prepare_pusht_cog_v4_data.py, state: "collected; train and validation encoded with I-JEPA; readability probes and pose decoding run",
           diagnostics: [results/pusht_cog/v4_pose_decoding_20261108.json]}
    availability: "corpora and features are on a teammate's project storage (/projects/work/yang-lab/users/yz12129); they regenerate on CPU with the PushT simulator packages"
    predictor: none trained
    code: src/bounded_memory/environments/pusht/ (simulator wrappers, corpus generators, probes; tests/pusht)
    configs: {}

tasks:
  # ---------------------------------------------------------------- Gate, migration check
  # The new package against the code it was extracted from, on the team's frozen bundle: episode
  # arrays, predictor outputs, kept frames, metric rows, teacher labels, scorer weights and the three
  # literature baselines must be identical; the rebuild chain (dataset, features, predictors) is
  # compared on a small configuration. Every Gate replay task waits for this to pass.
  # The old code is the base commit's experiments/ folder, kept outside the repository (BM_LEGACY_TREE):
  #   git archive fe69074 experiments | tar -x -C <folder>; ln -s <repo>/results <folder>/results
  gate.validate.migration:
    script: -m pytest -q -p no:cacheprovider tests/test_migration_gate.py
    seeds: null
    cwd: repo
    env: {BM_GATE_ROOT: "${BM_SCRATCH}/gate_team/root", BM_LEGACY_TREE: "${BM_SCRATCH}/legacy_fe69074", BM_MIGRATION_EPISODES: "48"}
    needs: [gate.assets.team_bundle]
    resources: {cpus: 8, mem: 24G, time: "01:30:00"}
  # ---------------------------------------------------------------- Gate, replay
  gate.assets.team_bundle:
    script: scripts/prepare_data/gate_team_bundle.py
    args: --work ${BM_SCRATCH}/gate_team
    seeds: null
    resources: {cpus: 4, mem: 16G, time: "01:00:00"}
    done_when: ${BM_SCRATCH}/gate_team/bundle_report.json
  gate.assets.dinov2:
    script: scripts/encode/dinov2.py
    config: configs/gate/team_bundle.yaml
    args: --out ${BM_SCRATCH}/gate_team/dinov2/features.npz --revision f9e44c814b77203eaa57a6bdbbd535f21ede1415 --device cpu
    seeds: null
    needs: [gate.assets.team_bundle]
    resources: {cpus: 16, mem: 24G, time: "02:00:00"}
    done_when: ${BM_SCRATCH}/gate_team/dinov2/features.npz
  gate.validate.dinov2:
    # re-encode with the new encoder script and compare with the features the reference rows were trained on
    script: scripts/encode/dinov2.py
    config: configs/gate/team_bundle.yaml
    args: --out ${BM_RUN}/gate/dinov2/features.npz --revision f9e44c814b77203eaa57a6bdbbd535f21ede1415 --device cpu --compare ${BM_SCRATCH}/gate_team/dinov2/features.npz
    seeds: null
    needs: [gate.assets.team_bundle]
    resources: {cpus: 16, mem: 24G, time: "03:00:00"}
  gate.replay.references:
    script: scripts/run_oracles/gate.py
    config: configs/gate/team_bundle.yaml
    out: gate/replay
    seeds: [17, 29, 43]
    needs: [gate.assets.team_bundle, gate.validate.migration]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.replay.heuristics:
    script: scripts/run_baselines/gate.py
    config: configs/gate/team_bundle.yaml
    out: gate/replay
    seeds: [17, 29, 43]
    needs: [gate.assets.team_bundle, gate.validate.migration]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  gate.replay.deletion_cost:
    script: scripts/evaluate/gate.py
    config: configs/gate/team_bundle.yaml
    out: gate/replay
    seeds: [17, 29, 43]
    needs: [gate.replay.references, gate.replay.heuristics]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.replay.attention_proxy:
    script: scripts/run_ablations/gate.py
    config: configs/gate/team_bundle.yaml
    out: gate/replay
    seeds: [17, 29, 43]
    needs: [gate.assets.team_bundle, gate.validate.migration]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.replay.pafu_kv:
    script: scripts/train_baselines/gate.py
    config: configs/gate/team_bundle.yaml
    out: gate/replay
    seeds: [17, 29, 43]
    variants: {method: [pafu_kv, pafu_kv_repo]}
    needs: [gate.assets.team_bundle, gate.validate.migration]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  gate.replay.pacc:
    script: scripts/train_baselines/gate.py
    config: configs/gate/team_bundle.yaml
    out: gate/replay
    seeds: [17, 29, 43]
    variants: {method: [pacc_full, pacc_recurrent]}
    args: --checkpoints ${BM_RUN}/gate/replay/checkpoints
    needs: [gate.assets.team_bundle, gate.validate.migration]
    resources: {cpus: 16, mem: 24G, time: "06:00:00"}
    resubmit: 2          # the 2-slot variant needs about 4.5 CPU hours; a stopped task continues from its checkpoint
  gate.replay.framemorrow:
    script: scripts/train_baselines/gate.py
    config: configs/gate/team_bundle.yaml
    out: gate/replay
    seeds: [17, 29, 43]
    variants: {method: [fm_dinov2_published, fm_dinov2_online]}
    needs: [gate.assets.dinov2, gate.validate.migration]
    resources: {cpus: 16, mem: 24G, time: "06:00:00"}
  # ---------------------------------------------------------------- Gate, our scorer retrained on the team's predictors
  gate.retrain_scorer.teacher_labels:
    script: scripts/generate_teacher_labels/gate.py
    config: configs/gate/retrained_scorer_on_team_assets.yaml
    out: gate/retrain_scorer
    args: --out ${BM_RUN}/gate/retrain_scorer/labels
    seeds: [17, 29, 43]
    needs: [gate.assets.team_bundle, gate.validate.migration]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  gate.retrain_scorer.train:
    script: scripts/train_scorer/gate.py
    config: configs/gate/retrained_scorer_on_team_assets.yaml
    out: gate/retrain_scorer
    args: --labels ${BM_RUN}/gate/retrain_scorer/labels --checkpoints ${BM_RUN}/gate/retrain_scorer/students --compare ${BM_SCRATCH}/gate_team/extracted/model
    seeds: [17, 29, 43]
    needs: [gate.retrain_scorer.teacher_labels]
    resources: {cpus: 4, mem: 8G, time: "00:30:00"}
  gate.retrain_scorer.deletion_cost:
    script: scripts/evaluate/gate.py
    config: configs/gate/retrained_scorer_on_team_assets.yaml
    out: gate/retrain_scorer
    seeds: [17, 29, 43]
    needs: [gate.retrain_scorer.train]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.retrain_scorer.attention_proxy:
    script: scripts/run_ablations/gate.py
    config: configs/gate/retrained_scorer_on_team_assets.yaml
    out: gate/retrain_scorer
    seeds: [17, 29, 43]
    needs: [gate.retrain_scorer.train]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}

  # ---------------------------------------------------------------- Gate, everything retrained from scratch
  gate.retrain.assets:
    script: scripts/train_predictor/gate.py
    args: --stage all --work ${BM_SCRATCH}/gate_rebuilt --device cpu
    seeds: null
    resources: {cpus: 16, mem: 24G, time: "06:00:00"}
    resubmit: 2          # I-JEPA encoding of 42,560 frames and 360 training epochs take about 14 hours on CPU; every stage resumes
    done_when: ${BM_SCRATCH}/gate_rebuilt/predictor/gate/checksums.json
  gate.retrain.compare_assets:
    # dataset, features, normalisation, bases and decoder of the rebuilt tree against the team's tree
    script: scripts/evaluate/gate_assets_diff.py
    args: --reference ${BM_SCRATCH}/gate_team/root --candidate ${BM_SCRATCH}/gate_rebuilt --out ${BM_OUT}/gate/retrain
    seeds: null
    needs: [gate.retrain.assets]
    resources: {cpus: 4, mem: 16G, time: "01:00:00"}
  gate.retrain.compare_old_code:
    # the tree the pre-refactor code built on CPU (dataset, features, 25 epochs of seed 17; kept on
    # scratch) against the tree the package builds on CPU: old code against new code at full size
    script: scripts/evaluate/gate_assets_diff.py
    args: --reference ${BM_SCRATCH}/gate_clean_future --candidate ${BM_SCRATCH}/gate_rebuilt --out ${BM_OUT}/gate/retrain/old_code_tree --weights
    seeds: null
    needs: [gate.retrain.assets]
    resources: {cpus: 4, mem: 16G, time: "01:00:00"}
  gate.retrain.references:
    script: scripts/run_oracles/gate.py
    config: configs/gate/rebuilt.yaml
    out: gate/retrain
    seeds: [17, 29, 43]
    needs: [gate.retrain.assets]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.retrain.heuristics:
    script: scripts/run_baselines/gate.py
    config: configs/gate/rebuilt.yaml
    out: gate/retrain
    seeds: [17, 29, 43]
    needs: [gate.retrain.assets]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  gate.retrain.teacher_labels:
    script: scripts/generate_teacher_labels/gate.py
    config: configs/gate/rebuilt.yaml
    out: gate/retrain
    args: --out ${BM_RUN}/gate/retrain/labels
    seeds: [17, 29, 43]
    needs: [gate.retrain.assets]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  gate.retrain.train:
    script: scripts/train_scorer/gate.py
    config: configs/gate/rebuilt.yaml
    out: gate/retrain
    args: --labels ${BM_RUN}/gate/retrain/labels --checkpoints ${BM_RUN}/gate/retrain/students
    seeds: [17, 29, 43]
    needs: [gate.retrain.teacher_labels]
    resources: {cpus: 4, mem: 8G, time: "00:30:00"}
  gate.retrain.deletion_cost:
    script: scripts/evaluate/gate.py
    config: configs/gate/rebuilt.yaml
    out: gate/retrain
    seeds: [17, 29, 43]
    needs: [gate.retrain.train]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.retrain.attention_proxy:
    script: scripts/run_ablations/gate.py
    config: configs/gate/rebuilt.yaml
    out: gate/retrain
    seeds: [17, 29, 43]
    needs: [gate.retrain.train]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.retrain.pafu_kv:
    script: scripts/train_baselines/gate.py
    config: configs/gate/rebuilt.yaml
    out: gate/retrain
    seeds: [17, 29, 43]
    variants: {method: [pafu_kv, pafu_kv_repo]}
    needs: [gate.retrain.assets]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  # ---------------------------------------------------------------- Gate, the same chain on a GPU
  # The released predictors were encoded and trained on a GPU (device = cuda, one A100). gate.retrain.*
  # above runs on CPU; these tasks repeat it on a GPU, so a difference from the release is not one of hardware.
  gate.retrain_gpu.assets:
    # On a GPU, as the released predictors were (their run set device = cuda on one A100). On CPU the
    # same chain takes about 14 hours and gives slightly different features: use --device cpu, no gpu.
    script: scripts/train_predictor/gate.py
    args: --stage all --work ${BM_SCRATCH}/gate_rebuilt_gpu --device cuda --threads 4
    seeds: null
    resources: {cpus: 4, mem: 48G, time: "04:00:00", gpu: 1}      # four threads, as in the released run
    resubmit: 1          # every stage resumes
    done_when: ${BM_SCRATCH}/gate_rebuilt_gpu/predictor/gate/checksums.json
  gate.retrain_gpu.compare_assets:
    # dataset, features, normalisation, bases and decoder of the rebuilt tree against the team's tree
    script: scripts/evaluate/gate_assets_diff.py
    args: --reference ${BM_SCRATCH}/gate_team/root --candidate ${BM_SCRATCH}/gate_rebuilt_gpu --out ${BM_OUT}/gate/retrain_gpu
    seeds: null
    needs: [gate.retrain_gpu.assets]
    resources: {cpus: 4, mem: 16G, time: "01:00:00"}
  gate.retrain_gpu.compare_cpu:
    # the tree built on CPU (gate.retrain_gpu.assets) against the tree built on a GPU: the dataset must be
    # byte-identical; feature, basis and training-log differences measure CPU against GPU
    script: scripts/evaluate/gate_assets_diff.py
    args: --reference ${BM_SCRATCH}/gate_rebuilt --candidate ${BM_SCRATCH}/gate_rebuilt_gpu --out ${BM_OUT}/gate/retrain_gpu/cpu_tree --weights
    seeds: null
    needs: [gate.retrain_gpu.assets]
    resources: {cpus: 4, mem: 16G, time: "01:00:00"}
  gate.retrain_gpu.references:
    script: scripts/run_oracles/gate.py
    config: configs/gate/rebuilt_gpu.yaml
    out: gate/retrain_gpu
    seeds: [17, 29, 43]
    needs: [gate.retrain_gpu.assets]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.retrain_gpu.heuristics:
    script: scripts/run_baselines/gate.py
    config: configs/gate/rebuilt_gpu.yaml
    out: gate/retrain_gpu
    seeds: [17, 29, 43]
    needs: [gate.retrain_gpu.assets]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  gate.retrain_gpu.teacher_labels:
    script: scripts/generate_teacher_labels/gate.py
    config: configs/gate/rebuilt_gpu.yaml
    out: gate/retrain_gpu
    args: --out ${BM_RUN}/gate/retrain_gpu/labels
    seeds: [17, 29, 43]
    device: cuda          # the released teacher labels and scorers were computed in an A100 job
    needs: [gate.retrain_gpu.assets]
    resources: {cpus: 8, mem: 16G, time: "01:00:00", gpu: 1}
  gate.retrain_gpu.train:
    script: scripts/train_scorer/gate.py
    config: configs/gate/rebuilt_gpu.yaml
    out: gate/retrain_gpu
    args: --labels ${BM_RUN}/gate/retrain_gpu/labels --checkpoints ${BM_RUN}/gate/retrain_gpu/students
    seeds: [17, 29, 43]
    device: cuda
    needs: [gate.retrain_gpu.teacher_labels]
    resources: {cpus: 4, mem: 8G, time: "00:30:00", gpu: 1}
  gate.retrain_gpu.deletion_cost:
    script: scripts/evaluate/gate.py
    config: configs/gate/rebuilt_gpu.yaml
    out: gate/retrain_gpu
    seeds: [17, 29, 43]
    needs: [gate.retrain_gpu.train]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.retrain_gpu.attention_proxy:
    script: scripts/run_ablations/gate.py
    config: configs/gate/rebuilt_gpu.yaml
    out: gate/retrain_gpu
    seeds: [17, 29, 43]
    needs: [gate.retrain_gpu.train]
    resources: {cpus: 4, mem: 16G, time: "00:30:00"}
  gate.retrain_gpu.pafu_kv:
    script: scripts/train_baselines/gate.py
    config: configs/gate/rebuilt_gpu.yaml
    out: gate/retrain_gpu
    seeds: [17, 29, 43]
    variants: {method: [pafu_kv, pafu_kv_repo]}
    needs: [gate.retrain_gpu.assets]
    resources: {cpus: 8, mem: 16G, time: "01:00:00"}
  # ---------------------------------------------------------------- Synergy, assets and migration check
  synergy.assets.release:
    script: scripts/prepare_data/synergy_release.py
    args: --work ${BM_SCRATCH}/synergy
    seeds: null
